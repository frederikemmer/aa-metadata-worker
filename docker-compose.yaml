name: aa-metadata

# ─────────────────────────────────────────────────────────────────────────────
# Konfiguration: ALLES steht direkt hier – kein .env nötig.
# Nach Änderungen: docker compose up -d
#
# Zwei Container: postgres + api (API + integrierter Sync-Worker).
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:17.6-bookworm
    container_name: aa_metadata_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aa_metadata
      POSTGRES_USER: aa_metadata
      POSTGRES_PASSWORD: change-me-please        # ← anpassen!
      TZ: Europe/Berlin
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aa_metadata -d aa_metadata"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

  api:
    image: ghcr.io/frederikemmer/aa-metadata-worker:latest
    container_name: aa_metadata_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: aa_metadata
      POSTGRES_USER: aa_metadata
      POSTGRES_PASSWORD: change-me-please        # ← muss zu postgres passen!
      TZ: Europe/Berlin
      LOG_LEVEL: INFO
      METADATA_API_KEY:                          # optionaler Bearer-Schutz (leer = aus)
      API_STATEMENT_TIMEOUT_MS: "20000"          # COUNT(*) auf 24 Mio+ Rows braucht >10 s

      # Welche Collections importiert werden. Reihenfolge = Verarbeitungsreihenfolge:
      # Nur Quellen deren MD5 mit Anna's Archive fast_download API funktioniert.
      # ia2/gbooks/libby nutzen Datei-Checksummen (kein AA-Mirror) → kein Download-Link.
      # upload_records (136 GiB) bewusst zuletzt.
      AA_COLLECTIONS: zlib3_records,upload_records
      AA_MIRROR_BASE_URL: https://annas-archive.gd

      # Anna's Archive Membership-Key für fast_download API (optional).
      # Ohne Key wird kein fastDownloadUrl in /sources zurückgegeben.
      AA_FAST_DOWNLOAD_KEY:

      # Nicht-Buch-Subcollections aus upload_records werden verworfen:
      AA_UPLOAD_BLOCKED_SUBCOLLECTIONS: academia_edu,us_gov_tech_reports,wikilib,aaaaarg,magzdb
      # upload_records ohne echten Titel+Autor (aus Datei-Metadaten) verwerfen:
      AA_UPLOAD_REQUIRE_TITLE_AUTHOR: "true"
      # ia2 nur mit IA-mediatype "texts" (Bücher/Scans), Rest verwerfen:
      AA_IA_REQUIRE_TEXTS: "true"
      # gbooks: Magazine (printType != BOOK) verwerfen:
      AA_GBOOKS_REQUIRE_BOOKS: "true"
      # libby: behaltene Medientypen (Rest verwerfen):
      AA_LIBBY_ALLOWED_TYPES: ebook,audiobook

      # Sync-Verhalten:
      SYNC_REUSE_PREV_PAYLOAD: "true"
      SYNC_ENABLED: "true"
      SYNC_SCHEDULE: "03:15"                     # HH:MM Europe/Berlin
      SYNC_BATCH_SIZE: "20000"
      SYNC_ERROR_ABORT_RATE: "0.02"              # Import abbrechen ab 2 % Fehlerrate
      SYNC_MAX_DOWNLOADS: "4"                    # Parallele Torrent-Downloads

      # Storage-Budget (GiB): Warnung / harter Stopp für Downloads+Imports
      STORAGE_WARN_GIB: "300"
      STORAGE_STOP_GIB: "400"
    volumes:
      - ./data/sync_work:/work/sync              # read-write für Torrent-Downloads
    ports:
      # Dashboard + API im LAN erreichbar (z. B. http://<server-ip>:8010/dashboard).
      - "8010:8010"
      # libtorrent Peer-to-Peer (DHT/PEX) — noinspection DockerComposeResolvePortInspection
      - "6881-6885:6881-6885"
      - "6881-6885:6881-6885/udp"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health/live', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
      - docker_bridge

networks:
  internal:
    driver: bridge
  docker_bridge:
    external: true
