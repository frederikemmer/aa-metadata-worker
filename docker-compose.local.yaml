name: aa-metadata

# ─────────────────────────────────────────────────────────────────────────────
# Lokale-Build-Variante: baut das App-Image aus dem Repo statt es zu pullen.
#
#   Erstbuild / Rebuild nach Codeänderung:
#     docker compose -f docker-compose.local.yaml up -d --build
#   Nur starten (nutzt vorhandenes lokales Image):
#     docker compose -f docker-compose.local.yaml up -d
#   Stoppen:
#     docker compose -f docker-compose.local.yaml down
#
# pull_policy: "never" ⇒ fehlt das Image, bricht Compose mit Fehler ab,
# statt es aus einer Registry zu ziehen.
# Zwei Container: postgres + api (API + integrierter Sync-Worker).
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:17.6-bookworm
    container_name: aa_metadata_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: aa_metadata
      POSTGRES_USER: aa_metadata
      POSTGRES_PASSWORD: change-me-please        # ← anpassen!
      TZ: Europe/Berlin
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aa_metadata -d aa_metadata"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aa-metadata-worker:local              # lokales Build-Tag
    pull_policy: "never"                         # nie pullen, nur lokal bauen/verwenden
    container_name: aa_metadata_api_local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: aa_metadata
      POSTGRES_USER: aa_metadata
      POSTGRES_PASSWORD: change-me-please        # ← muss zu postgres passen!
      TZ: Europe/Berlin
      LOG_LEVEL: INFO
      METADATA_API_KEY:                          # optionaler Bearer-Schutz (leer = aus)
      API_STATEMENT_TIMEOUT_MS: "20000"

      AA_COLLECTIONS: zlib3_records,upload_records,ia2_records
      AA_MIRROR_BASE_URL: https://annas-archive.gd
      AA_UPLOAD_BLOCKED_SUBCOLLECTIONS: academia_edu,us_gov_tech_reports,wikilib,aaaaarg,magzdb
      AA_UPLOAD_REQUIRE_TITLE_AUTHOR: "true"
      AA_IA_REQUIRE_TEXTS: "true"

      SYNC_REUSE_PREV_PAYLOAD: "true"
      SYNC_ENABLED: "true"
      SYNC_SCHEDULE: "03:15"
      SYNC_BATCH_SIZE: "20000"
      SYNC_ERROR_ABORT_RATE: "0.02"
      STORAGE_WARN_GIB: "300"
      STORAGE_STOP_GIB: "400"
    volumes:
      - ./data/sync_work:/work/sync              # read-write für Torrent-Downloads
    ports:
      - "8010:8010"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health/live', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2gb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
      - docker_bridge

networks:
  internal:
    driver: bridge
  docker_bridge:
    external: true
